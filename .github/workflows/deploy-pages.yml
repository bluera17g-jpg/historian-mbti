name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 只读代码 + 发布 Pages 所需的权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个发布；排队等待而不打断进行中的部署
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: 构建静态产物
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 生产构建
        run: pnpm build

      # enablement: true 会在 Pages 尚未开启时尝试自动开启；若仓库策略不允许，
      # 需手动到 Settings → Pages 把 Source 设为 GitHub Actions（本仓库已开启）
      - name: 配置 Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: 上传构建产物
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: 发布到 Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
